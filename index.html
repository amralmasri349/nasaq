al search",C:"Smoke & wind",D:"Route scouting",base:"Ops base",station:"Fire station",airport:"Airport \xB7 restricted airspace",wh:"Warehouse 14"},steps:["Mission input","Confirmation","Task graph","Verifier checks","Allocation","Execution","AI analysis","Human decides","Change of intent","Mission running"],understood:"Understood as",fields:[["Mission","Possible fire, Warehouse 14"],["Task graph","Search for people \u2192 map site \xB7 smoke \xB7 open route"],["Priority","Human life first"],["Constraints","Airspace \xB7 privacy \xB7 environment"]],alertTitle:"Possible fire \xB7 Warehouse 14",alertBody:"AI analysis of thermal and RGB imagery: not an AC unit. Its heat keeps rising and never stabilizes, and a second drone sees smoke.",evidence:"Attribution check 5/5",peopleTitle:"2 people detected \xB7 east fence",peopleBody:"Thermal signatures only. No identification is performed.",log:{cmd:"Mission received (voice, Saudi dialect).",confirm:"Operator confirmed the mission.",plan:"Planner built a task graph: 4 tasks with priorities and dependencies.",reject:"GEO-03 rejected: smoke-monitoring route passes 312 m from the airport.",replan:"Replanned outside restricted airspace. Plan approved.",alloc:"CBBA allocated tasks by sensor, battery and link: 4 \xB7 4 \xB7 2 \xB7 2 drones.",launch:"Swarm launched. No drone is flown by hand.",battery:"E-113 battery 18% \u2192 returning to base.",realloc:"Task re-auctioned: E-119 moves from route scouting to perimeter. Operator not interrupted.",hot:"AI thermal analysis (E-117): roof hotspot rising 38 \u2192 62 \xB0C, unlike an AC unit.",confirm2:"AI RGB analysis (E-121): smoke over the same roof.",alert:"Explained alert generated. Every sentence linked to drone evidence (5/5).",dispatch:"Operator dispatched Civil Defense. Scouting drones hold the route open.",dismiss:"Operator dismissed the alert. Swarm keeps monitoring.",people:"AI thermal analysis: 2 people near the east fence (no identification).",east:"Operator: \u201CPriority
